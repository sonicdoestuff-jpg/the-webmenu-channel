<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, initial-scale=1.0">
  <title>SwitchBrowse - the webmenu channel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      background: #eef1f7;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 18px 60px;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      padding: 12px 20px;
      border-radius: 10px;
      border: 2px solid #cbd5e0;
      margin-bottom: 12px;
      flex-shrink: 0;
    }
    h2 { color: #1b4f9c; font-size: 20px; }
    .actions { display: flex; gap: 12px; }
    .btn {
      background: #e4e8f1;
      color: #1a202c;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      border: 3px solid transparent;
    }
    .btn:focus, .btn:hover {
      border-color: #2b6cb0;
      background: #ffffff;
      outline: none;
    }
    .frame-box {
      flex: 1;
      background: #ffffff;
      border-radius: 10px;
      border: 2px solid #cbd5e0;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="top">
    <h2>SwitchBrowse Search</h2>
    <div class="actions">
      <a href="https://cse.google.com/cse?cx=c04ad583bbe7a43cf#gsc.tab=0" class="btn">Open Fullscreen</a>
      <a href="index.html" class="btn">Back to Library</a>
    </div>
  </div>
  <div class="frame-box">
    <iframe src="https://cse.google.com/cse?cx=c04ad583bbe7a43cf#gsc.tab=0"></iframe>
  </div>
</body>
</html>
